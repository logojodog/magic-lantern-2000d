name: Build 2000D with M-Film hooks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3 python3-docutils python3-setuptools zip unzip git make
          arm-none-eabi-gcc --version | head -n 1

      - name: Add M-Film passive hooks
        run: python3 apply_hooks.py .

      - name: Build autoexec.bin
        run: |
          cd platform/2000D.121
          make clean
          make 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect AUTOEXEC.BIN
        run: |
          mkdir -p out
          found=$(find platform/2000D.121 -maxdepth 2 -iname autoexec.bin | head -n 1)
          if [ -z "$found" ]; then echo "no autoexec.bin"; exit 1; fi
          cp "$found" out/AUTOEXEC.BIN
          ls -l out/AUTOEXEC.BIN
          md5sum out/AUTOEXEC.BIN

      - name: Build LiveView-only filmos.mo
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/HNGSeries/M-Film.git /tmp/M-Film
          sed -i 's/#define FOS_LV_ONLY 0/#define FOS_LV_ONLY 1/' /tmp/M-Film/ml-dev/fork/src/filmroll.c
          grep -n FOS_LV_ONLY /tmp/M-Film/ml-dev/fork/src/filmroll.c | head -5

          MOD=modules/filmos
          rm -rf "$MOD"
          mkdir -p "$MOD"

          cp /tmp/M-Film/ml-dev/fork/src/filmroll.c "$MOD/"
          cp /tmp/M-Film/ml-dev/fork/src/filmos_mod.h "$MOD/"
          cp /tmp/M-Film/ml-dev/filmos/fos_*.c "$MOD/"
          cp /tmp/M-Film/ml-dev/filmos/fos.h "$MOD/" 2>/dev/null || true
          cp /tmp/M-Film/ml-dev/filmos/fos_*.h "$MOD/" 2>/dev/null || true
          printf '#define MFILM_VERSION "0.2.1-2000D-LV"\n' > "$MOD/fos_version.h"
          cp filmos-Makefile "$MOD/Makefile"

          OBJS="filmroll.o fos_gfx.o fos_film.o fos_ui.o fos_shelf.o fos_pages.o fos_hud.o fos_print.o fos_dark.o fos_dev.o fos_lab.o fos_looks.o fos_jpeg.o"
          cd "$MOD"
          make FILMOS_PLATFORM=2000D.121 FILMOS_OBJS="$OBJS" 2>&1 | tee "$GITHUB_WORKSPACE/filmos-build.log" | tail -100

          if [ -f build/filmos.mo ]; then
            cp build/filmos.mo "$GITHUB_WORKSPACE/out/filmos.mo"
            ls -l "$GITHUB_WORKSPACE/out/filmos.mo"
          else
            echo "filmos.mo not produced"
            tail -40 "$GITHUB_WORKSPACE/filmos-build.log" || true
          fi

      - name: Summary
        run: |
          ls -l out/ || true
          if [ -f out/filmos.mo ]; then echo "filmos.mo OK"; else echo "filmos.mo MISSING"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2000D-mfilm-hooks
          path: |
            out/
            build.log
            filmos-build.log
